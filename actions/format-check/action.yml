# Checks a repository's C++ layout against its `.clang-format`, after the repository is checked out:
#
#   - uses: actions/checkout@v7
#   - uses: algotradelib/.github/actions/format-check@main
#     with:
#       files: "*.hpp *.cpp :(glob)include/cmdatl/*"
#
# It only reads: a difference fails the job, and nothing is formatted, committed or pushed.
# Tested on Linux runners (ubuntu-latest).
# The checks and their local use are in check-format.sh.

name: format-check
description: Check C++ files against the repository's .clang-format, with no visual alignment and no padded comments.

inputs:
  files:
    description: The C++ files, as space-separated git pathspecs; extensionless headers by name or :(glob)include/<name>/*.
    required: false
    default: '*.hpp *.cpp'
  exclude:
    description: Plain paths to leave out, space-separated (atlc's generated tests/codegen, say); no pathspec magic.
    required: false
    default: ''
  markdown:
    description: The Markdown files checked for padded trailing comments, as space-separated git pathspecs; empty means README*.md.
    required: false
    default: 'README*.md'
  tabs:
    description: true also fails on any tab in the C++ files; true or false.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The version every repository's .clang-format is written for.
    - shell: bash
      run: |
        pipx install clang-format==23.1.3
        clang-format --version

    - shell: bash
      env:
        FORMAT_FILES: ${{ inputs.files }}
        FORMAT_EXCLUDE: ${{ inputs.exclude }}
        FORMAT_MARKDOWN: ${{ inputs.markdown }}
        FORMAT_TABS: ${{ inputs.tabs }}
      run: '"$GITHUB_ACTION_PATH/check-format.sh"'
