# Installs atlc, the compiler for atls, from ghcr.io/algotradelib/atlc and puts it on PATH:
#
#   - uses: algotradelib/.github/actions/setup-atlc@main
#   - run: atlc --version
#
# Runners: Linux x64 and arm64 (statically linked, any distribution), macOS arm64, Windows x64.
# The runtime headers are compiled into atlc; `atlc run` also needs CMake, a C++17 compiler and algotradelib, which
# setup-atl installs.
#
# The tag moves with atlc's main branch.
# Before atlc's first release only the latest build is kept, so a digest whose tag has moved lasts only until the next
# publish; a fixed build waits for a release.

name: setup-atlc
description: Download atlc for this runner and add it to PATH.

inputs:
  channel:
    description: Which build to pull; the tag is <channel>-<platform>. Only main exists.
    required: false
    default: main
  token:
    description: >-
      Token to log in to ghcr.io with. Leave it empty while the package is public.
      For a private package, pass github.token and give the job packages: read.
    required: false
    default: ''

outputs:
  path:
    description: The unpacked atlc folder, as a native path on this OS.
    value: ${{ steps.pull.outputs.path }}
  atlc:
    description: The atlc executable (atlc.exe on Windows), as a native path; atlc is also on PATH.
    value: ${{ steps.pull.outputs.atlc }}

runs:
  using: composite
  steps:
    - id: platform
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64 ;;
          Linux-ARM64) platform=linux-arm64 ;;
          macOS-ARM64) platform=macos-arm64 ;;
          Windows-X64) platform=windows-x64 ;;
          *) echo "::error::No atlc is published for $RUNNER_OS-$RUNNER_ARCH."; exit 1 ;;
        esac
        echo "platform=$platform" >> "$GITHUB_OUTPUT"

    # v2.0.2 is the first release whose version table lists ORAS 1.3.4.
    - uses: oras-project/setup-oras@v2.0.2
      with:
        version: 1.3.4

    - id: pull
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        PLATFORM: ${{ steps.platform.outputs.platform }}
        TOKEN: ${{ inputs.token }}
      run: |
        # A directory of its own, apart from setup-atl's, and relative paths from here on: GNU tar in Git Bash reads
        # D:\... as a remote host.
        dir="$RUNNER_TEMP/atlc-package"
        rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
        # A credentials file of its own, so the caller's own login is left alone.
        # Without a token the pull is anonymous, even if the job logged in to ghcr.io earlier.
        echo '{}' > auth.json
        if [ -n "$TOKEN" ]; then
          printf '%s' "$TOKEN" | oras login ghcr.io --registry-config auth.json -u "$GITHUB_ACTOR" --password-stdin
        fi
        oras pull --registry-config auth.json "ghcr.io/algotradelib/atlc:$CHANNEL-$PLATFORM"
        rm -f auth.json
        tar -xzf "atlc-$PLATFORM.tar.gz"
        path="$(pwd -W 2>/dev/null || pwd)/atlc"
        exe=atlc
        if [ "$RUNNER_OS" = Windows ]; then exe=atlc.exe; fi
        echo "$path/bin" >> "$GITHUB_PATH"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "atlc=$path/bin/$exe" >> "$GITHUB_OUTPUT"
