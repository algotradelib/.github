# Points a repository's formula in the Homebrew tap at the commit just pushed to main, after that commit's CI passed.
# Before the first release each formula pins a commit of main (`url "...git", revision: "<commit>"`); this writes the
# new commit and a version that sorts higher (`<base>.<commit time, UTC, YYYYMMDDHHMMSS>`), since `brew upgrade`
# compares versions, then commits and pushes to the tap.
#
#   tap:
#     needs: [build]
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     runs-on: ubuntu-latest
#     steps:
#       - uses: algotradelib/.github/actions/update-tap@main
#         with:
#           formula: algotradelib
#           token: ${{ secrets.ALGOTRADELIB_PAGE_PAT }}
#
# The token must be able to push to the tap: the job's own GITHUB_TOKEN cannot reach another repository.
# It is masked in the log and given to git as an HTTP header through the environment, never in a URL, a command line
# or a file. The tap is cloned into a folder of RUNNER_TEMP, removed when the step ends; the caller's workspace is not
# touched.
# A push event only (it reads the head commit's time); on ubuntu (GNU date).

name: update-tap
description: Point the repository's Homebrew formula in algotradelib/homebrew-atls at the commit just pushed to main.

inputs:
  formula:
    description: The formula's name, Formula/<formula>.rb in the tap.
    required: true
  token:
    description: A token that can push to the tap.
    required: true
  tap:
    description: The tap repository.
    required: false
    default: algotradelib/homebrew-atls

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAP: ${{ inputs.tap }}
        TOKEN: ${{ inputs.token }}
        FORMULA: ${{ inputs.formula }}
        COMMIT: ${{ github.sha }}
        WHEN: ${{ github.event.head_commit.timestamp }}
      run: |
        set -euo pipefail
        if [ -z "$WHEN" ]; then
          echo "::error::update-tap runs on a push event (it reads the head commit's time)."
          exit 1
        fi
        # The token, and the header made of it, never appear in the log.
        echo "::add-mask::$TOKEN"
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
        dir=$(mktemp -d "$RUNNER_TEMP/homebrew-tap.XXXXXX")
        trap 'rm -rf "$dir"' EXIT
        git clone -q "https://github.com/$TAP.git" "$dir"
        cd "$dir"
        stamp=$(date -u -d "$WHEN" +%Y%m%d%H%M%S)
        file="Formula/$FORMULA.rb"
        if [ "$(grep -c 'revision: "[0-9a-f]\{40\}"' "$file")" != 1 ] || [ "$(grep -c '^  version "' "$file")" != 1 ]; then
          echo "::error::$file needs exactly one revision: \"<commit>\" and one version line"
          exit 1
        fi
        old=$(sed -n 's/.*revision: "\([0-9a-f]\{40\}\)".*/\1/p' "$file")
        if [ "$old" = "$COMMIT" ]; then
          echo "$file already pins $COMMIT"
          exit 0
        fi
        base=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$file" | sed -E 's/\.[0-9]{14}$//')
        sed -i -e "s/revision: \"$old\"/revision: \"$COMMIT\"/" -e "s/^  version \".*\"$/  version \"$base.$stamp\"/" "$file"
        echo "$file: ${old:0:7} -> ${COMMIT:0:7}, version $base.$stamp"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -qam "$FORMULA: ${COMMIT:0:7} [skip ci]"
        # Another repository's update may land first: replay this one on top, a few times.
        for _ in 1 2 3; do
          if git push -q; then
            exit 0
          fi
          git pull -q --rebase
        done
        echo "::error::the tap could not be pushed after three attempts"
        exit 1
